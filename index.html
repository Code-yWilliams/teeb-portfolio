<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting to christinasookhoo.com</title>
    <link rel="canonical" href="https://christinasookhoo.com/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://christinasookhoo.com/" />
    <script>
      // Preserve any path-less query string / fragment across the hop.
      location.replace('https://christinasookhoo.com/' + location.search + location.hash);
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #12426a;
        background: #fff;
      }
      a { color: #12426a; }
    </style>
  </head>
  <body>
    <p>
      This site has moved to
      <a href="https://christinasookhoo.com/">christinasookhoo.com</a>.
    </p>
  </body>
</html>
